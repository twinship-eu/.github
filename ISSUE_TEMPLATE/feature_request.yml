name: Feature request
description: Suggest an idea, an improvement or an ontology extension
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve TwinShip! Please search existing issues first.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to achieve, and what is missing or difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe what you would like to happen. For ontology changes, include the term, its definition and how it relates to existing concepts.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, references to standards, examples or mock-ups.
