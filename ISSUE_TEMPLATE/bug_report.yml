name: Bug report
description: Report something that is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search existing issues first.
        **Security vulnerabilities must not be reported here.** See our [security policy](https://github.com/twinship-eu/.github/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps, commands or data needed to reproduce the problem.
      placeholder: |
        1. Run `...`
        2. Open `...`
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include error messages or logs if available.
      render: text
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release tag or commit SHA you are using.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Python/Node version, Docker version, etc.
      placeholder: |
        - OS: Ubuntu 24.04
        - Python: 3.12
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots or anything else that helps. Please do not share confidential vessel or pilot data.
