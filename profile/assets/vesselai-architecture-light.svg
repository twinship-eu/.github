<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="512" viewBox="0 0 1040 512" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">VesselAI platform architecture</title>
<desc id="d">Applications sit on top of a FastAPI control plane that applies role- and attribute-based access control in front of the storage layer (MinIO, Trino, Hive Metastore, Spark and Delta, OpenMetadata) and the ML layer (Dagster, MLflow, JupyterHub, notebook API). An anonymizer encrypts partner data into the data lake. Keycloak provides single sign-on to the applications, the broker, Trino and OpenMetadata.</desc>
